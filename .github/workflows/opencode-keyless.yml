name: OpenCode Keyless Free Model Test

on:
  workflow_dispatch:

permissions: {}

jobs:
  opencode-test:
    name: OpenCode Keyless Smoke Test
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - name: Install latest OpenCode
        shell: bash
        run: |
          set -euo pipefail

          npm install --global @opencode/cli@latest

          echo "========================================"
          echo "VERSIONS"
          echo "========================================"
          opencode --version
          node --version
          jq --version

      - name: Discover zero-cost keyless OpenCode models
        id: models
        shell: bash
        env:
          NO_COLOR: "1"
        run: |
          set -euo pipefail

          CATALOG="$RUNNER_TEMP/models-dev.json"
          FREE="$RUNNER_TEMP/free-models.txt"
          AVAILABLE_FULL="$RUNNER_TEMP/opencode-models.txt"
          AVAILABLE="$RUNNER_TEMP/opencode-model-ids.txt"
          CANDIDATES="$RUNNER_TEMP/candidates.txt"

          echo "========================================"
          echo "1. DOWNLOAD MODELS.DEV CATALOG"
          echo "========================================"

          curl \
            --fail \
            --silent \
            --show-error \
            --location \
            --retry 3 \
            --retry-all-errors \
            --connect-timeout 10 \
            --max-time 30 \
            "https://models.dev/api.json?type=all" \
            -o "$CATALOG"

          jq -e '
            (.opencode.models | type) == "object"
          ' "$CATALOG" >/dev/null

          echo
          echo "========================================"
          echo "2. FIND COMPLETELY ZERO-COST MODELS"
          echo "========================================"

          jq -r '
            .opencode.models
            | to_entries

            | map(
                select(
                  # Input/output explicitly zero.
                  (.value.cost.input? == 0)
                  and
                  (.value.cost.output? == 0)

                  # reasoning/cache/audio/tier etc. dahil cost
                  # altında bulunan TÜM sayısal ücretler sıfır olmalı.
                  and
                  (
                    [
                      (.value.cost // {})
                      | ..
                      | numbers
                    ]
                    | all(. == 0)
                  )

                  # Deprecated modeli kullanma.
                  and
                  (
                    (.value.status? // "active")
                    != "deprecated"
                  )

                  # Decision-only özel model kullanma.
                  and
                  (
                    (.value.type? // "")
                    != "decision"
                  )

                  # Normal text response verebilmeli.
                  and
                  (
                    (
                      .value.modalities.output?
                      // ["text"]
                    )
                    | index("text") != null
                  )
                )
              )

            # Tool desteği olanları ve büyük context modellerini öne al.
            | sort_by(
                [
                  (
                    if (.value.tool_call? // false)
                    then 0
                    else 1
                    end
                  ),
                  -(.value.limit.context? // 0)
                ]
              )

            | .[].key
          ' "$CATALOG" > "$FREE"

          FREE_COUNT="$(grep -c . "$FREE" || true)"

          echo "Models.dev zero-cost model count: $FREE_COUNT"
          echo

          nl -ba "$FREE"

          if [ "$FREE_COUNT" -eq 0 ]; then
            echo "::error::No completely zero-cost OpenCode models found."
            exit 1
          fi

          echo
          echo "========================================"
          echo "3. ASK OPENCODE WHAT IS KEYLESS/AVAILABLE"
          echo "========================================"

          # Yeni, boş bir HOME kullan:
          # GitHub runner üzerinde eski auth/config bulunmasın.
          export HOME="$RUNNER_TEMP/discovery-home"
          export XDG_CONFIG_HOME="$RUNNER_TEMP/discovery-config"
          export XDG_DATA_HOME="$RUNNER_TEMP/discovery-data"
          export XDG_CACHE_HOME="$RUNNER_TEMP/discovery-cache"

          mkdir -p \
            "$HOME" \
            "$XDG_CONFIG_HOME" \
            "$XDG_DATA_HOME" \
            "$XDG_CACHE_HOME"

          unset OPENCODE_API_KEY || true

          if opencode models --standalone > "$AVAILABLE_FULL" 2>&1; then
            echo "OpenCode model discovery succeeded."
          else
            echo "OpenCode model discovery returned non-zero."
            echo "Will fall back to Models.dev candidates."
          fi

          echo
          echo "Raw OpenCode models:"
          cat "$AVAILABLE_FULL" || true

          # Beklenen satır:
          # opencode/mimo-v2.6-flash-free
          #
          # Sadece opencode provider'ını al ve provider prefix'ini kaldır.
          sed -n \
            -E 's/^[[:space:]]*opencode\/([^[:space:]]+).*$/\1/p' \
            "$AVAILABLE_FULL" \
            | sort -u \
            > "$AVAILABLE"

          echo
          echo "========================================"
          echo "4. INTERSECT FREE + KEYLESS"
          echo "========================================"

          if [ -s "$AVAILABLE" ]; then

            # FREE dosyasındaki öncelik sırasını koru.
            awk '
              NR == FNR {
                available[$0] = 1
                next
              }

              available[$0] {
                print
              }
            ' "$AVAILABLE" "$FREE" > "$CANDIDATES"

          else
            echo "Could not obtain OpenCode keyless model list."
            echo "Using zero-cost Models.dev list directly."

            cp "$FREE" "$CANDIDATES"
          fi

          # Intersection boşsa da Models.dev'e fallback.
          if [ ! -s "$CANDIDATES" ]; then
            echo "Intersection returned zero models."
            echo "Using zero-cost Models.dev list directly."

            cp "$FREE" "$CANDIDATES"
          fi

          echo
          echo "========================================"
          echo "FINAL CANDIDATES"
          echo "========================================"

          nl -ba "$CANDIDATES"

          CANDIDATE_COUNT="$(grep -c . "$CANDIDATES" || true)"

          echo
          echo "Candidate count: $CANDIDATE_COUNT"

          if [ "$CANDIDATE_COUNT" -eq 0 ]; then
            echo "::error::No candidate model remains."
            exit 1
          fi

          echo "file=$CANDIDATES" >> "$GITHUB_OUTPUT"

      - name: Run keyless free-model smoke test
        shell: bash
        env:
          NO_COLOR: "1"

          MODEL_FILE: ${{ steps.models.outputs.file }}

          # Küçük test.
          MAX_MODELS: "15"
          PER_MODEL_TIMEOUT: "60"

          # Tamamen temiz OpenCode ortamı.
          HOME: ${{ runner.temp }}/test-home
          XDG_CONFIG_HOME: ${{ runner.temp }}/test-config
          XDG_DATA_HOME: ${{ runner.temp }}/test-data
          XDG_CACHE_HOME: ${{ runner.temp }}/test-cache

        run: |
          set -uo pipefail

          mkdir -p \
            "$HOME" \
            "$XDG_CONFIG_HOME" \
            "$XDG_DATA_HOME" \
            "$XDG_CACHE_HOME"

          unset OPENCODE_API_KEY || true

          # Repoya bile ihtiyacımız yok.
          TEST_DIR="$RUNNER_TEMP/opencode-smoke-project"

          mkdir -p "$TEST_DIR"
          cd "$TEST_DIR"

          echo "OpenCode smoke test" > README.md

          echo "========================================"
          echo "KEYLESS SMOKE TEST"
          echo "========================================"
          echo "API key: NONE"
          echo "Maximum attempts: $MAX_MODELS"
          echo "Timeout/model: ${PER_MODEL_TIMEOUT}s"

          ATTEMPT=0
          SUCCESS=0
          WINNER=""

          while IFS= read -r MODEL; do
            [ -n "$MODEL" ] || continue

            ATTEMPT=$((ATTEMPT + 1))

            if [ "$ATTEMPT" -gt "$MAX_MODELS" ]; then
              echo
              echo "Maximum attempt count reached."
              break
            fi

            FULL_MODEL="opencode/$MODEL"

            echo
            echo "========================================"
            echo "ATTEMPT $ATTEMPT"
            echo "MODEL: $FULL_MODEL"
            echo "========================================"

            # GitHub'ın implicit bash -e davranışının fallback
            # zincirini öldürmemesi için komut if içinde.
            if OUTPUT="$(
              timeout "${PER_MODEL_TIMEOUT}s" \
                opencode run \
                --standalone \
                --model "$FULL_MODEL" \
                "Reply with exactly OPENCODE_OK and nothing else." \
                2>&1
            )"
            then
              STATUS=0
            else
              STATUS=$?
            fi

            echo "$OUTPUT"

            if \
              [ "$STATUS" -eq 0 ] \
              && grep -Fq "OPENCODE_OK" <<< "$OUTPUT"
            then
              SUCCESS=1
              WINNER="$FULL_MODEL"

              echo
              echo "========================================"
              echo "✅ SUCCESS"
              echo "========================================"
              echo "Model: $WINNER"
              echo "API key: NONE"
              echo "Attempts: $ATTEMPT"

              break
            fi

            if [ "$STATUS" -eq 124 ]; then
              echo "⚠️ TIMEOUT: $FULL_MODEL"
            else
              echo "⚠️ FAILED: $FULL_MODEL (exit=$STATUS)"
            fi

          done < "$MODEL_FILE"

          echo

          if [ "$SUCCESS" -eq 1 ]; then

            {
              echo "## ✅ OpenCode keyless test passed"
              echo
              echo "- **Model:** \`$WINNER\`"
              echo "- **API key:** none"
              echo "- **Cost filter:** all numeric cost fields = \$0"
              echo "- **Attempts:** $ATTEMPT"
            } >> "$GITHUB_STEP_SUMMARY"

            exit 0
          fi

          {
            echo "## ❌ OpenCode keyless test failed"
            echo
            echo "No zero-cost candidate produced OPENCODE_OK."
            echo
            echo "- **API key:** none"
            echo "- **Attempts:** $ATTEMPT"
          } >> "$GITHUB_STEP_SUMMARY"

          echo "::error::No zero-cost keyless model passed the smoke test."
          exit 1

      - name: Cleanup
        if: always()
        shell: bash
        run: |
          rm -rf \
            "$RUNNER_TEMP/models-dev.json" \
            "$RUNNER_TEMP/free-models.txt" \
            "$RUNNER_TEMP/opencode-models.txt" \
            "$RUNNER_TEMP/opencode-model-ids.txt" \
            "$RUNNER_TEMP/candidates.txt" \
            "$RUNNER_TEMP/discovery-home" \
            "$RUNNER_TEMP/discovery-config" \
            "$RUNNER_TEMP/discovery-data" \
            "$RUNNER_TEMP/discovery-cache" \
            "$RUNNER_TEMP/test-home" \
            "$RUNNER_TEMP/test-config" \
            "$RUNNER_TEMP/test-data" \
            "$RUNNER_TEMP/test-cache" \
            "$RUNNER_TEMP/opencode-smoke-project"
