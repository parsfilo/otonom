name: OpenCode Keyless Smoke Test

on:
  workflow_dispatch:

permissions: {}

jobs:
  opencode-test:
    runs-on: ubuntu-latest
    timeout-minutes: 6

    steps:
      - name: Install latest OpenCode
        shell: bash
        run: |
          set -euo pipefail

          npm install --global @opencode/cli@latest

          echo "OpenCode version:"
          opencode --version

      - name: Show keyless available models
        shell: bash
        run: |
          set -euo pipefail

          echo "Models available without credentials:"
          opencode models --standalone || true

      - name: Run keyless free-model smoke test
        shell: bash
        run: |
          set -u

          # No OPENCODE_API_KEY.
          # OpenCode itself uses its public/free access path.

          MODELS=(
            "opencode/mimo-v2.5-free"
            "opencode/ling-3.0-flash-fin-free"
            "opencode/nemotron-3.5-lightning-free"
            "opencode/nemotron-3-ultra-free"
            "opencode/muse-spark-1.3-contributor-free"
            "opencode/big-pickle"
          )

          SUCCESS=0

          for MODEL in "${MODELS[@]}"; do
            echo
            echo "========================================"
            echo "Testing: $MODEL"
            echo "========================================"

            # IMPORTANT:
            # Put the failing command inside an `if`.
            # This prevents GitHub Actions' implicit `bash -e`
            # from killing the job before fallback can run.
            if OUTPUT="$(
              timeout 60s opencode run \
                --standalone \
                --model "$MODEL" \
                "Reply with exactly OPENCODE_OK and nothing else." \
                2>&1
            )"; then
              STATUS=0
            else
              STATUS=$?
            fi

            echo "$OUTPUT"

            if [ "$STATUS" -eq 0 ] && grep -Fq "OPENCODE_OK" <<< "$OUTPUT"; then
              echo
              echo "✅ SUCCESS"
              echo "Model: $MODEL"
              echo "API key: NONE"
              SUCCESS=1
              break
            fi

            if [ "$STATUS" -eq 124 ]; then
              echo "⚠️ Timeout: $MODEL"
            else
              echo "⚠️ Failed: $MODEL (exit=$STATUS)"
            fi
          done

          echo
          echo "========================================"

          if [ "$SUCCESS" -eq 1 ]; then
            echo "✅ OpenCode keyless smoke test passed."
            exit 0
          fi

          echo "::error::No keyless free OpenCode model responded successfully."
          exit 1
